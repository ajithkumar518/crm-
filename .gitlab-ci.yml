# GitLab CI/CD pipeline for suki_crm (Next.js 16 + Prisma)
# This file must be at the root of the repository.
#
# GitLab variables you may need to set (Settings > CI/CD > Variables):
#   - DATABASE_URL              # only if the build or runtime needs it
#   - NEXT_PUBLIC_CRM_VARIANT   # optional, defaults to "1" if not set
#   - OPENAI_API_KEY            # only if build/runtime needs it
# Add any other secrets your app requires as masked/protected variables.

# This runner is a shell executor, so we install Node locally.
# If you switch to a Docker runner later, replace the before_script with `image: node:20`.

stages:
  - install
  - build
  - test
  - deploy

variables:
  NODE_VERSION: "20.15.1"
  NODE_HOME: "$CI_PROJECT_DIR/tools/node"
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - tools/node/
    - .npm/

before_script:
  - mkdir -p tools/node
  - if [ ! -f "$NODE_HOME/bin/node" ]; then curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" -o node.tar.xz && tar -xJf node.tar.xz --strip-components=1 -C tools/node; fi
  - export PATH="$NODE_HOME/bin:$PATH"
  - node -v && npm -v

install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

build:
  stage: build
  script:
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - prisma/
    expire_in: 1 day
  dependencies:
    - install

test:
  stage: test
  script:
    - npm run lint
  dependencies:
    - install

deploy:
  stage: deploy
  script:
    - echo "Deploy step is not configured yet."
    - echo "Add your production deployment commands here (SSH, Docker, Kubernetes, GitLab Pages, etc.)."
  dependencies:
    - build
  only:
    - main
  when: manual
  environment:
    name: production
    url: https://your-domain.com
