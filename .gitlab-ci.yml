# shahnaz-crm -- build pipeline (egress-sandboxed)
#
# WHAT CHANGED, 2026-09-05, and why
# ---------------------------------
# This pipeline used to run on a `shell` executor: jobs executed directly on the
# deployment VM as a user in the `docker` group, i.e. root-equivalent, with
# unrestricted internet access. Anyone who could land a commit here could
# exfiltrate the whole source tree or take the VM, and with it the other
# applications sharing it. It was the top finding of the 2026-09-03 audit
# (P0 #4); cadence and axia were migrated on 2026-09-04/05.
#
# Now:
#   * Jobs run on the `ci-sandbox` Docker-executor runner on this VM: a
#     throwaway container, no docker socket, no host mounts, no privileges.
#   * All egress goes through a domain-allowlisting proxy. github.com and
#     pastebin.com are not reachable from a build. This app needs Debian, npm
#     and binaries.prisma.sh, all derived from its Dockerfile.
#   * The build no longer builds into the host Docker engine. It is handed to a
#     per-project buildkit daemon and the result is pushed to the registry.
#   * NOTHING HERE DEPLOYS. A host agent watches the registry and deploys when
#     :latest moves. CI cannot touch the running stack at all.
#
# NOTE ON THE REGISTRY. The old file said this pipeline avoided the container
# registry because pushing to it hung and took GitLab down. That was true when
# written; the registry defect was fixed on 2026-08-28 (ops-runbooks
# ci-cd/gitlab-registry-diagnosis.md). The stale warning is why this VM kept
# building locally -- and building locally is what required the root-equivalent
# shell executor. The registry is verified working.
#
# WHERE THE OLD JOBS WENT
#   deploy   -> stack-deploy-agent@shahnaz-crm on this VM (systemd timer).
#   verify   -> the agent verifies health and auto-rolls-back on failure.
#   cleanup  -> the agent prunes images after each deploy.
#   db-task  -> each former DB_SCRIPT dropdown option is now its own manual job
#               in the `ops` stage. They do not RUN anything here; see below.
#   rollback -> manual `rollback` job, same mechanism.
#
# To run a database task WITHOUT shipping code, start a pipeline with OPS_ONLY=1:
# you get the manual ops jobs and nothing else.
# See ops-runbooks ci-cd/ci-build-sandbox.md.

.deploy_rules: &deploy_rules
  - if: $CI_PIPELINE_SOURCE == "web"
  - if: $CI_PIPELINE_SOURCE == "api"
  - if: $CI_PIPELINE_SOURCE == "trigger"
  - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - scan
  - deploy
  - ops

variables:
  OPS_ONLY:
    value: "0"
    options: ["0", "1"]
    description: >-
      1 = ops-only pipeline (database/rollback jobs only; nothing is built,
      published or deployed). 0 = normal build pipeline.
  REGISTRY: registry.sukierp.com
  IMAGE_BASE: registry.sukierp.com/ajithkumars/shahnaz_crm
  # Each project gets its OWN buildkit daemon. A shared one made pushes attempt
  # cross-repository blob mounts from a sibling project and get refused with
  # insufficient_scope, and shared build cache between projects.
  BUILDKIT_HOST: tcp://172.32.0.6:1234
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: "none"

default:
  tags:
    - ci-sandbox
  retry: 0

# ---------------------------------------------------------------------------
# BUILD -- one image, pushed to the registry, tagged with the commit SHA.
# :latest is published ONLY from the default branch on a deliberately-triggered
# pipeline, because :latest is what the deploy agent watches. Two guards: a
# merge request cannot publish it, and neither can a "Run pipeline" against a
# feature branch.
# ---------------------------------------------------------------------------
build:
  stage: build
  rules:
    - if: $OPS_ONLY == "1"
      when: never
    - *deploy_rules
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image:
    name: moby/buildkit:v0.16.0
    entrypoint: [""]
  script:
    - set -eu
    # Fail loudly if the sandbox is not actually fencing egress, rather than
    # quietly building in an unprotected environment.
    - |
      if env -u https_proxy -u HTTPS_PROXY -u http_proxy -u HTTP_PROXY \
           wget -q -T 8 -O /dev/null https://registry.npmjs.org/ 2>/dev/null; then
        echo "FAIL: direct egress works -- the sandbox is not in effect"; exit 1
      fi
      echo "ok: egress fenced"
    - mkdir -p ~/.docker
    - |
      AUTH=$(printf '%s:%s' gitlab-ci-token "$CI_JOB_TOKEN" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$AUTH" > ~/.docker/config.json
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ] \
         && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$IMAGE_BASE/app:$CI_COMMIT_SHORT_SHA,$IMAGE_BASE/app:latest"
        echo "publishing SHA and :latest -- the deploy agent will pick this up"
      else
        TAGS="$IMAGE_BASE/app:$CI_COMMIT_SHORT_SHA"
        echo "not default branch (or an MR): publishing SHA tag only, NOT :latest"
      fi
      echo "TAGS=$TAGS" > build.env
    - . ./build.env
    # HTTP_PROXY/HTTPS_PROXY/NO_PROXY are predefined build args: BuildKit exposes
    # them to every RUN without an explicit ARG, which is how apt-get, npm ci and
    # `prisma generate` reach the allowlisted mirrors.
    - |
      buildctl --addr "$BUILDKIT_HOST" build \
        --frontend dockerfile.v0 --local context=. --local dockerfile=. \
        --opt build-arg:HTTP_PROXY="$HTTP_PROXY" \
        --opt build-arg:HTTPS_PROXY="$HTTPS_PROXY" \
        --opt build-arg:NO_PROXY="$NO_PROXY" \
        --output "type=image,\"name=$TAGS\",push=true" \
        --metadata-file /tmp/md-TAGS.json
    - |
      # Record what was actually pushed, so the deploy stage can prove that the
      # image now serving traffic is the one THIS pipeline produced -- rather
      # than assuming a push means a deployment.
      DIGESTS=""
      for m in /tmp/md-*.json; do
        # buildctl writes this pretty-printed, so key and value are separated
        # by ": " and may sit on separate lines. Flatten first rather than
        # trying to match the whitespace.
        d=$(tr -d ' \n' < "$m" | sed -n 's/.*"containerimage.digest":"\([^"]*\)".*/\1/p')
        [ -n "$d" ] || { echo "FAIL: no digest recorded in $m"; exit 1; }
        DIGESTS="$DIGESTS $d"
      done
      DIGESTS=$(echo $DIGESTS)
      echo "PUSHED_DIGESTS=$DIGESTS" >> build.env
      echo "pushed digests: $DIGESTS"
  artifacts:
    reports:
      dotenv: build.env

# ---------------------------------------------------------------------------
# SCANS -- these previously ran `docker run -v /var/run/docker.sock:...`, which
# needs the host daemon and would have kept the shell executor alive. They now
# run AS the scanner image inside the sandbox: no socket, no host access.
#
# Each carries an explicit merge_request_event rule. Without one GitLab does not
# CREATE the job on an MR pipeline at all, so the pipeline would report success
# having silently skipped every scan.
# ---------------------------------------------------------------------------
.scan_rules: &scan_rules
  - if: $OPS_ONLY == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
  - if: $CI_PIPELINE_SOURCE == "api"
  - if: $CI_PIPELINE_SOURCE == "trigger"
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy:image:
  stage: scan
  allow_failure: true
  rules: *scan_rules
  needs: [build]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: gitlab-ci-token
    TRIVY_PASSWORD: $CI_JOB_TOKEN
  script:
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --timeout 15m
      "$IMAGE_BASE/app:$CI_COMMIT_SHORT_SHA"

trivy:fs:
  stage: scan
  allow_failure: true
  rules: *scan_rules
  needs: []
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      --scanners vuln,secret,misconfig "$CI_PROJECT_DIR"

gitleaks:
  stage: scan
  allow_failure: true
  rules: *scan_rules
  needs: []
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source "$CI_PROJECT_DIR" --no-git --redact

# ---------------------------------------------------------------------------
# DEPLOY -- visibility, not action.
#
# Nothing in this file deploys. A host agent does that on its own timer, and
# that stays true: CI must not be able to touch a running stack (2026-09-03
# audit, P0 #4). But it meant a pipeline went green having only PUSHED an
# image, so nobody could tell from GitLab whether the deployment happened --
# and a host-side failure (a registry login quietly failing, which has actually
# happened) was invisible here.
#
# So this job watches. It asks the broker which image digests are really
# serving traffic and waits until those are the digests this pipeline pushed
# AND the app answers healthy. That is the deploy signal that was missing.
#
# It sends only its CI_JOB_TOKEN, exactly like the ops jobs. The comparison is
# done HERE, so the broker still accepts no input from CI, and `deploy:verify`
# is a read-only builtin on the host -- it cannot change anything.
# ---------------------------------------------------------------------------
"deploy:verify":
  stage: deploy
  needs: [build]
  rules:
    - if: $OPS_ONLY == "1"
      when: never
    # Only a default-branch build publishes :latest, and only :latest is ever
    # deployed. Anywhere else there is deliberately nothing to wait for.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
  timeout: 30m
  image:
    name: curlimages/curl:latest
    entrypoint: [""]
  variables:
    DEPLOY_WAIT_SECONDS: "900"
    HEALTH_EXPECT: "200"
  script:
    - |
      set -eu
      [ -n "${PUSHED_DIGESTS:-}" ] || { echo "FAIL: the build reported no digest"; exit 1; }
      echo "waiting for the host to roll out this build"
      echo "  expecting: $PUSHED_DIGESTS"
      deadline=$(( $(date +%s) + DEPLOY_WAIT_SECONDS ))
      n=0
      while :; do
        n=$((n+1))
        code=$(curl -s -o /tmp/st -w '%{http_code}' --max-time 60 \
                 -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" \
                 http://172.32.0.1:8099/run || echo 000)
        if [ "$code" != "200" ]; then
          echo "broker returned HTTP $code"; cat /tmp/st 2>/dev/null || true; exit 1
        fi
        missing=""
        for d in $PUSHED_DIGESTS; do
          grep -q "$d" /tmp/st || missing="$missing $d"
        done
        hc=$(sed -n 's/^health_code=//p' /tmp/st)
        if [ -z "$missing" ] && [ "$hc" = "$HEALTH_EXPECT" ]; then
          echo "--- DEPLOYED: every image from this build is running, and the app is healthy."
          cat /tmp/st
          exit 0
        fi
        if [ "$(date +%s)" -ge "$deadline" ]; then
          echo "--- TIMED OUT after ${DEPLOY_WAIT_SECONDS}s."
          echo "    not yet running:${missing:- (none)}"
          echo "    health_code=$hc (wanted $HEALTH_EXPECT)"
          echo ""
          echo "The build pushed fine -- the HOST has not taken it. On the VM:"
          echo "    sudo journalctl -u stack-deploy-agent@shahnaz-crm -n 50"
          echo "A 'registry login failed' there means the deploy token needs attention."
          echo ""
          cat /tmp/st
          exit 1
        fi
        echo "attempt $n: not yet (missing:${missing:- none}, health=$hc) -- waiting 15s"
        sleep 15
      done

# ---------------------------------------------------------------------------
# OPS -- the database and rollback jobs, back in the pipeline where developers
# expect them, but without CI holding any host access.
#
# HOW THIS IS SAFE. These jobs send exactly one thing: their own CI_JOB_TOKEN.
# A broker on the VM asks GitLab who that token belongs to, and maps the JOB'S
# NAME to a fixed command from a table that lives ON THE HOST
# (/etc/stack-ops/shahnaz-crm.tasks), not in this repo. Nothing written in this file
# is ever executed on the VM.
#
# So editing this file cannot grant new powers. Renaming a job to something the
# broker does not know simply gets a 403; changing a job's `script` is
# irrelevant, because the script is not what runs. The broker also refuses any
# job whose ref is not `main`, and any token from a job that is not running.
# Every request is logged with the GitLab username that clicked it:
#   journalctl -u stack-ops-broker
#
# Direct host equivalents remain: `sudo stack-ops shahnaz-crm <cmd>` on the VM.
# ---------------------------------------------------------------------------
.ops_rules: &ops_rules
  # Only ever on a deliberate ops-only pipeline. These used to be manual
  # buttons on EVERY build pipeline, which left a destructive job one careless
  # click away and contradicted this file's own instructions. Set OPS_ONLY=1 on
  # Run pipeline to get them.
  - if: $OPS_ONLY != "1"
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
    when: manual
  - if: $CI_PIPELINE_SOURCE == "api"
    when: manual
  - if: $CI_PIPELINE_SOURCE == "trigger"
    when: manual

.ops_request: &ops_request
  stage: ops
  needs: []
  allow_failure: false
  rules: *ops_rules
  image:
    name: curlimages/curl:latest
    entrypoint: [""]
  script:
    - |
      echo "requesting action '$CI_JOB_NAME' from the ops broker"
      code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 1900 \
               -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" \
               http://172.32.0.1:8099/run)
      cat /tmp/out
      echo "--- broker returned HTTP $code"
      [ "$code" = "200" ] || exit 1

# --- everyday
"status": { <<: *ops_request }
"prisma:status": { <<: *ops_request }
"prisma:validate": { <<: *ops_request }
"prisma:generate": { <<: *ops_request }
"prisma:migrate-deploy": { <<: *ops_request }
"seed:superadmin": { <<: *ops_request }
"seed:suki-masters": { <<: *ops_request }
"seed:company-configs": { <<: *ops_request }

# --- recovery
"rollback": { <<: *ops_request }

# --- DESTRUCTIVE. Its own explicitly-named job so it is not reachable by
#     picking the wrong entry in a dropdown, which is how the old DB_SCRIPT
#     variable worked. Clicking it IS the confirmation -- there is no TTY
#     to prompt on -- so treat it accordingly.
#       prisma:db-push = prisma db push --accept-data-loss: no migration
#       history, and it can drop columns without asking.
"prisma:db-push": { <<: *ops_request }
